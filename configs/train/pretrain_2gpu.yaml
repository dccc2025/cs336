nproc_per_node: 2
gpu: rtx4080
memory_per_gpu_gb: 32
system_ram_gb: 64
seq_len: 2048
precision: fp16
fsdp: true
optimizer_shard: true
activation_checkpoint: true
# Tune after first profile; 32GB/card should allow a modest micro-batch.
micro_batch_size: 4
grad_accum_steps: 8
max_lr: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 2000
grad_clip: 1.0
seed: 0
checkpoint_dir: artifacts/checkpoints/pretrain
log_dir: artifacts/logs
